services:
  docs:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-30}
      MAX_BACKUP_MB: ${MAX_BACKUP_MB:-512}
    volumes:
      - ./storage:/app/storage
